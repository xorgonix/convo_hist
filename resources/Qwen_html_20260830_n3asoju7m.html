<!DOCTYPE html>
<html>
<head>
<style>
body { width: 340px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 12px; margin: 0; }
h3 { margin: 0 0 10px 0; font-size: 16px; color: #333; }
#chat-list { max-height: 260px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 10px; background: #fafafa; }
.chat-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; font-size: 13px; color: #444; display: flex; justify-content: space-between; align-items: center; }
.chat-item:last-child { border-bottom: none; }
.chat-item:hover { background-color: #e9ecef; }
.chat-item.selected { background-color: #d1e7dd; font-weight: bold; color: #0f5132; }
.chat-item.updated { background-color: #fff3cd; color: #856404; border-left: 4px solid #ffc107; }
.badge { font-size: 10px; background: #ffc107; color: #000; padding: 2px 6px; border-radius: 10px; font-weight: bold; margin-left: 8px; white-space: nowrap;}
button { padding: 8px; width: 100%; cursor: pointer; border: none; border-radius: 4px; font-size: 13px; font-weight: bold; margin-bottom: 6px; }
#download-btn { background: #10a37f; color: white; }
#download-btn:disabled { background: #ccc; cursor: not-allowed; }
.btn-secondary { background: #6c757d; color: white; }
.btn-secondary:hover { background: #5a6268; }
.btn-warning { background: #fd7e14; color: white; }
.btn-warning:hover { background: #e36d09; }
#status { color: #10a37f; font-weight: bold; margin-top: 10px; display: none; text-align: center; font-size: 13px;}
.hint { font-size: 11px; color: #888; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<h3>ChatGPT Extractor</h3>
<div style="display: flex; gap: 6px; margin-bottom: 10px;">
    <button id="export-index-btn" class="btn-secondary" style="width: 50%;">Export Index</button>
    <button id="load-index-btn" class="btn-warning" style="width: 50%;">Check Offline</button>
</div>
<input type="file" id="file-input" accept=".json" style="display:none;">
<div id="chat-list"><p style="padding: 10px; color: #888;">Loading chats...</p></div>
<button id="load-more-btn" class="btn-secondary" style="display: none;">Load More Conversations</button>
<button id="download-btn" disabled>Download Selected as JSON</button>
<div id="status">Downloaded successfully!</div>
<div class="hint">Yellow = Updated since your last offline save</div>
<script src="popup.js"></script>
</body>
</html>
